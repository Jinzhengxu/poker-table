# 德州扑克在线桌 —— 生产编排
#
# 关键约定：
#   1. 本服务【不映射任何宿主端口】。宿主的 80/443 属于已经在跑的
#      matrix-chat-caddy-1，抢占会直接把已有的 matrix 服务搞挂。
#      外部流量的路径是：Cloudflare -> 宿主 443 -> 已有 Caddy 容器
#      -> 同一 docker 网络内直连 poker:8080。
#   2. 因此 poker 必须加入 Caddy 所在的那个【已存在的】外部网络，
#      网络名由 deploy/deploy.sh 探测后写入同目录的 .env（CADDY_NETWORK=xxx）。
#      手工跑的话：echo 'CADDY_NETWORK=matrix-chat_default' > .env
#
# 启动：docker compose up -d --build

services:
  poker:
    build:
      context: .
      dockerfile: Dockerfile
    image: poker-table:latest
    container_name: poker
    restart: unless-stopped

    # 用 docker-init(tini) 当 PID 1：Node 作为 PID 1 时默认信号处理会被忽略，
    # docker stop 要等满 10s 超时才 SIGKILL；有了 init 能立刻优雅退出。
    init: true

    environment:
      PORT: "8080"
      TZ: Asia/Shanghai
      NODE_ENV: production

      # 人机用的 LLM key，从项目根目录的 .env 透传进来（compose 会自动读 .env）。
      # 一个都不填也能跑，人机会退化成规则策略。见 .env.example。
      KIMI_API_KEY: "${KIMI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      POKER_BOT_PROVIDER: "${POKER_BOT_PROVIDER:-auto}"
      POKER_BOT_MODEL: "${POKER_BOT_MODEL:-}"
      POKER_BOT_BASE_URL: "${POKER_BOT_BASE_URL:-}"
      POKER_BOT_TIMEOUT_MS: "${POKER_BOT_TIMEOUT_MS:-8000}"
      POKER_BOT_EQUITY_SIMS: "${POKER_BOT_EQUITY_SIMS:-20000}"
      POKER_BOT_EQUITY_MS: "${POKER_BOT_EQUITY_MS:-1500}"
      POKER_BOT_EQUITY_CHUNK_MS: "${POKER_BOT_EQUITY_CHUNK_MS:-8}"

      # 牌桌初始设置。不填就用代码默认值（盲注 5/10、起始筹码 1000）。
      # 填了以后每次重启都是这个配置，不用再手工点一遍设置页。见 .env.example。
      POKER_BLINDS: "${POKER_BLINDS:-}"
      POKER_SMALL_BLIND: "${POKER_SMALL_BLIND:-}"
      POKER_BIG_BLIND: "${POKER_BIG_BLIND:-}"
      POKER_ANTE: "${POKER_ANTE:-}"
      POKER_STARTING_STACK: "${POKER_STARTING_STACK:-}"
      POKER_ACTION_TIMEOUT: "${POKER_ACTION_TIMEOUT:-}"
      POKER_NEXT_HAND_DELAY: "${POKER_NEXT_HAND_DELAY:-}"
      POKER_AUTO_NEXT_HAND: "${POKER_AUTO_NEXT_HAND:-}"

    # 只在 docker 网络内部暴露，宿主上看不到这个端口。
    # 注意：这里【故意没有 ports:】，不要手贱加回来。
    expose:
      - "8080"

    networks:
      - caddy

    # 1GB 小机的硬约束：容器最多 200M，正常运行远低于这个数（见 README 资源占用）。
    mem_limit: 200m
    mem_reservation: 64m
    stop_grace_period: 10s

    # 日志上限 10m × 3 份 = 最多 30M，防止小机被日志把磁盘/inode 撑爆。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy:
    # external: true 表示这个网络由 matrix-chat 那套 compose 创建，
    # 我们只是接入，绝不创建也绝不删除它。
    external: true
    name: ${CADDY_NETWORK:?未设置 CADDY_NETWORK，请先执行 deploy/deploy.sh，或手工写入 .env}
