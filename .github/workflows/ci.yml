name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上只保留最新一次运行，推连续几个 commit 时不浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 是 Dockerfile 用的版本；24 提前发现上游变更
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 项目刻意没有引入 linter 依赖，用 node 自带的语法检查兜底
      - name: node --check every source file
        run: |
          find server public test -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Shellcheck the deploy script
        run: shellcheck --severity=warning deploy/deploy.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t poker-table:ci .

      - name: Boot it and hit /healthz
        run: |
          docker run -d --name poker-ci -p 8080:8080 poker-table:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthz ok after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy" >&2
          docker logs poker-ci >&2
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f poker-ci || true
